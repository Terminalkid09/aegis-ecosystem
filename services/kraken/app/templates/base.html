<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="{{ public_base_path }}/" />
    <title>{% block title %}Kraken{% endblock %}</title>
    <!-- Vendored locally: the UI must work in an air-gapped deployment. -->
    <script src="static/vendor/tailwind.js"></script>
    <script src="static/vendor/chart.umd.min.js"></script>
    <link rel="stylesheet" href="static/vendor/leaflet.css" />
    <script src="static/vendor/leaflet.js"></script>
    <script src="static/js/base.js"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
        .nav-link { display: flex; align-items: center; gap: .75rem; padding: .625rem 1rem;
            border-radius: .5rem; font-size: .875rem; font-weight: 500;
            color: #cbd5e1; transition: background-color .15s, color .15s; }
        .nav-link:hover { background: rgba(255,255,255,.1); color: #fff; }
        .nav-link.active { background: #4f46e5; color: #fff; }
        .card { background: #fff; border: 1px solid #e2e8f0; border-radius: .75rem; padding: 1.25rem; }
        .dark .card { background: #1e293b; border-color: #334155; }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen flex">

    <!-- Sidebar -->
    <aside class="w-60 shrink-0 bg-slate-900 dark:bg-slate-950 flex flex-col py-6 px-3 min-h-screen">
        <div class="flex items-center gap-3 px-3 mb-8">
            <span class="text-3xl">🦑</span>
            <div>
                <div class="font-bold text-white text-lg leading-tight">Kraken</div>
                <div class="text-xs text-slate-500">Honeypot Platform</div>
            </div>
        </div>
        <nav class="flex flex-col gap-1 flex-1">
            <a href="./" class="nav-link {% if active_page == 'dashboard' %}active{% endif %}">
                <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                </svg>
                Dashboard
            </a>
            <a href="events" class="nav-link {% if active_page == 'events' %}active{% endif %}">
                <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                </svg>
                Attack Events
            </a>
            <a href="plugins" class="nav-link {% if active_page == 'plugins' %}active{% endif %}">
                <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M11 4a2 2 0 114 0v1a1 1 0 001 1h3a1 1 0 011 1v3a1 1 0 01-1 1h-1a2 2 0 100 4h1a1 1 0 011 1v3a1 1 0 01-1 1h-3a1 1 0 01-1-1v-1a2 2 0 10-4 0v1a1 1 0 01-1 1H7a1 1 0 01-1-1v-3a1 1 0 00-1-1H4a2 2 0 110-4h1a1 1 0 001-1V7a1 1 0 011-1h3a1 1 0 001-1V4z"/>
                </svg>
                Plugins
            </a>
            <a href="operations" class="nav-link {% if active_page == 'operations' %}active{% endif %}">
                <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M4 6h16M4 12h16M4 18h16"/>
                </svg>
                Operations
            </a>
            <a href="reports" class="nav-link {% if active_page == 'reports' %}active{% endif %}">
                <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                </svg>
                Reports
            </a>
            <a href="api/docs" target="_blank" class="nav-link">
                <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/>
                </svg>
                API Docs
            </a>
        </nav>
        <!-- Export shortcuts -->
        <div class="border-t border-white/10 pt-4 px-2 mb-4">
            <p class="text-xs text-slate-500 uppercase tracking-wider px-2 mb-2">Export</p>
            <a href="api/v1/export/csv"  class="nav-link text-xs">📄 CSV</a>
            <a href="api/v1/export/json" class="nav-link text-xs">📋 JSON</a>
            <a href="api/v1/export/pdf"  class="nav-link text-xs">📑 PDF Report</a>
        </div>
        <!-- Theme toggle + logout -->
        <div class="border-t border-white/10 pt-4 px-2 flex flex-col gap-1">
            <button id="theme-toggle"
                    class="nav-link text-xs w-full text-left">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707M17.657 17.657l-.707-.707M6.343 6.343l-.707-.707M12 8a4 4 0 100 8 4 4 0 000-8z"/>
                </svg>
                Toggle Theme
            </button>
            <button id="logout-btn" class="nav-link text-xs w-full text-left text-rose-400">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a2 2 0 01-2 2H6a2 2 0 01-2-2V7a2 2 0 012-2h5a2 2 0 012 2v1"/>
                </svg>
                Logout
            </button>
        </div>
    </aside>

    <!-- Main -->
    <main class="flex-1 flex flex-col min-h-screen overflow-auto">
        <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 px-8 py-4 flex items-center justify-between shrink-0">
            <h1 class="font-semibold text-lg">{% block header %}Kraken{% endblock %}</h1>
            <div class="flex items-center gap-2 text-xs text-slate-400">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                Live
            </div>
        </header>
        <div class="flex-1 p-8">
            {% block content %}{% endblock %}
        </div>
    </main>

    {% block scripts %}{% endblock %}
</body>
</html>
