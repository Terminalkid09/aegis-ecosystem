name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt ruff==0.17.5 pip-audit
      - name: Fatal lint errors
        run: ruff check app tests --select E9,F63,F7,F82
      - name: Unit tests
        run: python -m pytest tests/unit -q --no-cov
      - name: Integration tests
        run: python -m pytest tests/integration -q --no-cov
      - name: Dependency audit
        run: pip-audit -r requirements.txt

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build application image
        run: docker build -t kraken-ci:${{ github.sha }} .
      - name: Build sandbox broker image
        run: docker build -f Dockerfile.broker -t kraken-broker-ci:${{ github.sha }} .
