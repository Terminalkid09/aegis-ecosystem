global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: aegis-brain
    metrics_path: /metrics
    static_configs:
      - targets: ["aegis-brain:8000"]
  - job_name: aegis-link
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["aegis-link:8080"]