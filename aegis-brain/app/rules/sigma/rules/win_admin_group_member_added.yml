title: User Added To Privileged Local Group
id: 2e6f9d80-4a37-4c5b-b1e9-7d3a8f0c5e64
status: stable
description: |
  L'aggiunta di un account ai gruppi Administrators/Remote Desktop Users è
  privilege escalation e persistence: l'attaccante si crea un accesso
  privilegiato duraturo.
references:
  - https://attack.mitre.org/techniques/T1098/
author: Aegis Sigma bundle
date: 2026/09/15
logsource:
  product: windows
  service: security
detection:
  selection_event:
    EventID:
      - 4728
      - 4732
      - 4756
  selection_group:
    GroupName|contains:
      - 'Administrators'
      - 'Administrateurs'
      - 'Administratoren'
      - 'Remote Desktop Users'
      - 'Domain Admins'
  condition: selection_event and selection_group
fields:
  - MemberName
  - TargetUserName
  - GroupName
falsepositives:
  - Onboarding IT pianificato e tracciato
level: high
tags:
  - attack.persistence
  - attack.privilege_escalation
  - attack.t1098
