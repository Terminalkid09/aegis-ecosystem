title: Windows Event Log Cleared
id: 3f2a1b64-0f6b-4a17-9d0e-6c1f4a2b7d10
status: stable
description: |
  La cancellazione del registro eventi (EventID 1102 su Security, 104 su System)
  è una tecnica anti-forensics: viene usata dopo un accesso non autorizzato per
  rimuovere le tracce. Non esiste un caso d'uso operativo legittimo frequente.
references:
  - https://attack.mitre.org/techniques/T1070/001/
author: Aegis Sigma bundle
date: 2026/09/15
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID:
      - 1102
  condition: selection
fields:
  - SubjectUserName
  - SubjectDomainName
falsepositives:
  - Azione amministrativa pianificata e tracciata a mano dal team IT
level: critical
tags:
  - attack.defense_evasion
  - attack.t1070.001
