title: SSH Authentication Failure
id: 4a8e2c31-5f79-4d2b-8c6a-3b9e1f7d0a52
status: stable
description: |
  Un fallimento di autenticazione SSH su un server esposto è il rumore di fondo
  di internet; su un host interno significa credenziali sbagliate, servizio
  misconfigurato o movimento laterale. Isolato è informativo, in volume è un
  attacco (vedi la regola di correlazione SSH brute force).
references:
  - https://attack.mitre.org/techniques/T1110/001/
author: Aegis Sigma bundle
date: 2026/09/15
logsource:
  product: linux
detection:
  selection:
    program|contains:
      - 'sshd'
      - 'ssh'
    message|contains:
      - 'Failed password'
      - 'authentication failure'
      - 'Invalid user'
  condition: selection
fields:
  - user
  - src_ip
falsepositives:
  - Password scadute su script di automazione
level: medium
tags:
  - attack.credential_access
  - attack.t1110.001
