title: Deception Credential Stuffing
id: kraken-sigma-credential-stuffing
status: stable
description: |
  Credenziali presentate a più protocolli honeypot, con un username, sono
  compatibili con credential stuffing. Un banner senza credenziali è escluso.
references:
  - https://attack.mitre.org/techniques/T1110/004/
author: Aegis Sigma bundle
date: 2026/11/17
logsource:
  product: kraken
detection:
  selection:
    signature:
      - http
      - ftp
      - telnet
      - rdp
      - smtp
      - smb
    user|exists: true
  condition: selection
fields:
  - src_ip
  - signature
  - user
falsepositives:
  - Browser che visita la pagina esca senza inviare credenziali
level: high
tags:
  - attack.credential_access
  - attack.t1110.004
