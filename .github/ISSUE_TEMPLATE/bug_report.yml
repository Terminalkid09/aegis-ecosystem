name: Bug report
description: Something does not behave as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report a security vulnerability here: follow
        [SECURITY.md](https://github.com/Terminalkid09/aegis-ecosystem/blob/main/SECURITY.md).
  - type: textarea
    id: symptom
    attributes:
      label: Symptom
      description: What happens, in one paragraph.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What the documentation says should happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What happens instead, including the exact error text.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and commit
      description: Release tag (for example `v4.3.0`) and commit when running from source.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - aegis-brain
        - aegis-agent
        - kraken
        - frontend
        - packaging (MSI/deb/RPM/ipk)
        - release and CI
        - documentation
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS and version, Docker/Compose or Docker Desktop, install method, and whether the host is a clean install.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Logs, `ak doctor` output, screenshots. Redact tokens, hostnames and customer data.
    validations:
      required: false
