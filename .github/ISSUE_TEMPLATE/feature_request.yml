name: Feature request
description: Propose a capability or a change in behaviour
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: The operator problem, not the solution. What is impossible or painful today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The change you would accept, and the component it belongs to.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds today, and why they are not enough.
    validations:
      required: false
  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
      description: What this feature must not change (contracts, defaults, release gates).
    validations:
      required: false
