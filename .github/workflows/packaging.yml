name: Endpoint Packaging

on:
  push:
    branches: [dev, main, "feat/**", "release/**"]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      production_signing:
        description: "Build with the production signing secrets (Windows PFX and Linux GPG)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: packaging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packaging_windows:
    name: Packaging Windows (test-signed MSI)
    timeout-minutes: 25
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.4'
          cache-dependency-path: aegis-agent/go.sum
      - name: Install WiX 5
        shell: pwsh
        run: |
          dotnet tool install --tool-path .tmp/wix5 wix --version 5.0.2
          .\.tmp\wix5\wix.exe extension add -g WixToolset.Util.wixext/5.0.2
      - name: Build and test-sign MSI
        shell: pwsh
        run: .\scripts\build-msi.ps1 -Version 4.3.0 -OutDir dist -TestSign
      - name: Show Authenticode identity
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature .\dist\aegis-agent-4.3.0-x64.msi
          if ($sig.Status -eq 'NotSigned') { throw 'MSI is not signed' }
          Write-Host "Status=$($sig.Status) Signer=$($sig.SignerCertificate.Subject)"
      - name: Upload MSI test artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aegis-agent-msi-test-signed
          path: |
            dist/*.msi
            dist/*.cer
            dist/*.sha256
            dist/*.signing.json
          if-no-files-found: error

  packaging_windows_install:
    name: Clean-host MSI install/uninstall
    needs: packaging_windows
    timeout-minutes: 15
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download MSI
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: aegis-agent-msi-test-signed
          path: dist
      - name: Install, verify service, uninstall
        shell: pwsh
        run: |
          $msi = (Get-ChildItem .\dist\*.msi | Select-Object -First 1).FullName
          if (-not $msi) { throw "MSI artifact missing" }
          $install = Start-Process msiexec.exe -ArgumentList @(
            "/i", $msi, "/qn", "/norestart", "/l*v", "$PWD\msi-install.log",
            "BRAIN_URL=https://aegis.invalid"
          ) -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            Get-Content "$PWD\msi-install.log" -Tail 80
            throw "MSI install failed (exit $($install.ExitCode))"
          }
          if (-not (Test-Path "C:\Program Files\Aegis\aegis-agent.exe")) {
            throw "agent binary was not installed"
          }
          $service = Get-Service -Name AegisAgent -ErrorAction SilentlyContinue
          if (-not $service) { throw "AegisAgent service was not registered" }
          $recovery = sc.exe qfailure AegisAgent
          if ($recovery -notmatch 'RESTART') {
            throw "AegisAgent recovery actions were not configured"
          }
          $uninstall = Start-Process msiexec.exe -ArgumentList @(
            "/x", $msi, "/qn", "/norestart"
          ) -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) {
            throw "MSI uninstall failed (exit $($uninstall.ExitCode))"
          }
          if (Test-Path "C:\Program Files\Aegis\aegis-agent.exe") {
            throw "agent binary survived uninstall"
          }
          if (Get-Service -Name AegisAgent -ErrorAction SilentlyContinue) {
            throw "AegisAgent service survived uninstall"
          }
          Write-Host "MSI install/uninstall PASS"

  packaging_windows_server:
    name: Packaging Windows server editions (test-signed MSIs)
    timeout-minutes: 40
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install WiX 5 and UI extension
        shell: pwsh
        run: |
          dotnet tool install --tool-path .tmp/wix5 wix --version 5.0.2
          .\.tmp\wix5\wix.exe extension add -g WixToolset.UI.wixext/5.0.2
      - name: Build all Windows server editions
        shell: pwsh
        run: |
          foreach ($edition in @("aegis", "kraken", "suite")) {
            .\scripts\build-server-msi.ps1 -Edition $edition -Version 4.3.0 -OutDir dist -TestSign
            if ($LASTEXITCODE -ne 0) { throw "Windows server build failed: $edition" }
          }
      - name: Validate MSI ICEs (only ICE61 suppressed)
        shell: pwsh
        run: |
          # ICE61/WIX1076 is expected: MajorUpgrade sets AllowDowngrades="yes" by
          # policy and declares no Maximum version. Suppress that single ICE and
          # keep every other validator enabled; the rationale is in
          # docs/RELEASE_POLICY.md and docs/PACKAGING.md.
          foreach ($stem in @("aegis-server", "kraken-server", "aegis-suite")) {
            $msi = "dist\$stem-4.3.0-x64.msi"
            .\.tmp\wix5\wix.exe msi validate -sice ICE61 $msi
            if ($LASTEXITCODE -ne 0) { throw "ICE validation failed: $msi" }
          }
          Write-Host "MSI ICE validation PASS (ICE61 suppressed)"
      - name: Administrative extraction and edition payload checks
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $cases = @(
            @{ Edition = "aegis";  Msi = "aegis-server-4.3.0-x64.msi";  Root = "Aegis Server";  Files = @("bin\ak.cmd", "bin\ak.ps1", "aegis\docker-compose.yml", "aegis\aegis-brain\app\main.py"); Absent = @("aegis\services\kraken") },
            @{ Edition = "kraken"; Msi = "kraken-server-4.3.0-x64.msi"; Root = "Kraken Server"; Files = @("bin\ak.cmd", "kraken\docker-compose.yml", "kraken\services\kraken\honeypot\runner.py"); Absent = @("aegis") },
            @{ Edition = "suite";  Msi = "aegis-suite-4.3.0-x64.msi";  Root = "Aegis Suite";   Files = @("bin\ak.cmd", "aegis\docker-compose.yml", "aegis\services\kraken\honeypot\runner.py"); Absent = @() }
          )
          foreach ($case in $cases) {
            $msi = (Resolve-Path (Join-Path .\dist $case.Msi)).Path
            $target = Join-Path $PWD "msi-$($case.Edition)-admin"
            if (Test-Path $target) { Remove-Item -LiteralPath $target -Recurse -Force }
            New-Item -ItemType Directory -Path $target -Force | Out-Null
            $p = Start-Process msiexec.exe -ArgumentList @("/a", $msi, "/qn", "TARGETDIR=$target") -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "administrative install failed for $($case.Edition): $($p.ExitCode)" }
            $server = Join-Path $target "PFiles64\$($case.Root)"
            foreach ($relative in $case.Files) {
              if (-not (Test-Path (Join-Path $server $relative))) { throw "missing $($case.Edition) payload: $relative" }
            }
            foreach ($relative in $case.Absent) {
              if (Test-Path (Join-Path $server $relative)) { throw "unexpected $($case.Edition) payload: $relative" }
            }
            if (-not (Test-Path (Join-Path $server "docs\RELEASE_POLICY.md"))) { throw "release policy missing from $($case.Edition)" }
            $env:AEGIS_SERVER_ROOT = $server
            $env:AEGIS_DATA_DIR = Join-Path $target "data"
            & (Join-Path $server "bin\ak.cmd") version
            if ($LASTEXITCODE -ne 0) { throw "ak version failed for $($case.Edition)" }
            & (Join-Path $server "bin\ak.cmd") help start | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "ak help failed for $($case.Edition)" }
            if ($case.Edition -eq "kraken") {
              & (Join-Path $server "bin\configure-server.ps1") -InstallRoot $server -DataDir $env:AEGIS_DATA_DIR -Edition kraken
            } else {
              & (Join-Path $server "bin\configure-server.ps1") -InstallRoot $server -DataDir $env:AEGIS_DATA_DIR -Edition $case.Edition -Domain aegis.local -Email internal -UiPort 3997
            }
            if ($LASTEXITCODE -ne 0) { throw "configure-server failed for $($case.Edition)" }
          }
          Write-Host "Windows server edition payloads PASS"
      - name: Upload Windows server MSIs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aegis-server-msis
          path: |
            dist/aegis-server-4.3.0-x64.msi*
            dist/kraken-server-4.3.0-x64.msi*
            dist/aegis-suite-4.3.0-x64.msi*
            dist/*test-signing.cer
          if-no-files-found: error

  packaging_windows_server_install:
    name: Clean-host Windows server install/uninstall
    needs: packaging_windows_server
    timeout-minutes: 20
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download server MSIs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: aegis-server-msis
          path: dist
      - name: Install, verify and uninstall each edition
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $cases = @(
            @{ Edition = "aegis";  Msi = "aegis-server-4.3.0-x64.msi";  Root = "Aegis Server";  Registry = "Server" },
            @{ Edition = "kraken"; Msi = "kraken-server-4.3.0-x64.msi"; Root = "Kraken Server"; Registry = "Kraken" },
            @{ Edition = "suite";  Msi = "aegis-suite-4.3.0-x64.msi";  Root = "Aegis Suite";   Registry = "Suite" }
          )
          foreach ($case in $cases) {
            $msi = (Resolve-Path (Join-Path .\dist $case.Msi)).Path
            $install = Start-Process msiexec.exe -ArgumentList @(
              "/i", "`"$msi`"", "/qn", "/norestart",
              "AEGIS_DOMAIN=aegis.local", "ACME_EMAIL=internal", "AEGIS_UI_PORT=3997"
            ) -Wait -PassThru
            if ($install.ExitCode -ne 0) { throw "install failed for $($case.Edition): $($install.ExitCode)" }
            $server = Join-Path $env:ProgramFiles $case.Root
            if (-not (Test-Path (Join-Path $server "bin\ak.cmd"))) { throw "ak missing after $($case.Edition) install" }
            & (Join-Path $server "bin\ak.cmd") version
            if ($LASTEXITCODE -ne 0) { throw "ak version failed after $($case.Edition) install" }
            & (Join-Path $server "bin\ak.cmd") help start | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "ak help failed after $($case.Edition) install" }
            if (-not (Test-Path "HKLM:\Software\Aegis\$($case.Registry)")) { throw "registry missing for $($case.Edition)" }
            $uninstall = Start-Process msiexec.exe -ArgumentList @("/x", "`"$msi`"", "/qn", "/norestart") -Wait -PassThru
            if ($uninstall.ExitCode -ne 0) { throw "uninstall failed for $($case.Edition): $($uninstall.ExitCode)" }
            if (Test-Path (Join-Path $server "bin\ak.cmd")) { throw "ak survived $($case.Edition) uninstall" }
            Write-Host "$($case.Edition) install/uninstall PASS"
          }

  packaging_linux:
    name: Packaging Linux (test-signed deb)
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.4'
          cache-dependency-path: aegis-agent/go.sum
      - name: Install Debian packaging tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev gnupg
      - name: Build and test-sign deb
        run: VERSION=4.3.0 ./scripts/build-deb.sh
      - name: Verify deb metadata, signature and checksum
        run: |
          dpkg-deb --info dist/aegis-agent_4.3.0_amd64.deb
          gpg --list-packets dist/aegis-agent_4.3.0_amd64.deb.asc | head -20
          (cd dist && sha256sum -c aegis-agent_4.3.0_amd64.deb.sha256)
      - name: Upload deb test artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aegis-agent-deb-test-signed
          path: |
            dist/*.deb
            dist/*.asc
            dist/*.sha256
            dist/*.signing.json
          if-no-files-found: error

  packaging_linux_install:
    name: Clean-host deb install/uninstall
    needs: packaging_linux
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Download deb
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: aegis-agent-deb-test-signed
          path: dist
      - name: Install, verify layout, remove
        run: |
          set -euxo pipefail
          sudo dpkg -i dist/*.deb
          test -x /usr/local/bin/aegis-agent
          unit_path="$(dpkg -L aegis-agent | grep -E '/(usr/)?lib/systemd/system/aegis-agent\.service$')"
          test -n "$unit_path"
          test -f "$unit_path"
          sudo test -f /etc/aegis-agent/aegis-agent.env.example
          sudo dpkg -r aegis-agent
          test ! -e /usr/local/bin/aegis-agent
          test ! -e "$unit_path"
          echo "deb install/uninstall PASS"

  packaging_server:
    name: Packaging server (self-signed pilot)
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Debian packaging tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev gnupg
      - name: Build complete Aegis/Kraken packages and bundle
        run: VERSION=4.3.0 SIGNING_MODE=self-signed ./scripts/build-server-deb.sh
      - name: Verify metadata, signatures, contents and bundle
        run: |
          set -euo pipefail
          test -f dist/aegis_4.3.0_amd64.deb
          test -f dist/kraken_4.3.0_amd64.deb
          test -f dist/aegis-suite_4.3.0_all.deb
          test -f dist/aegis-suite-4.3.0.tar.gz
          dpkg-deb --field dist/aegis_4.3.0_amd64.deb Package Version Depends
          dpkg-deb --field dist/kraken_4.3.0_amd64.deb Package Version Depends
          dpkg-deb --field dist/aegis-suite_4.3.0_all.deb Package Version Depends
          gpg --import dist/aegis-pilot-signing-key.asc
          for f in dist/aegis_4.3.0_amd64.deb dist/kraken_4.3.0_amd64.deb dist/aegis-suite_4.3.0_all.deb; do
            gpg --batch --verify "$f.asc" "$f"
            (cd dist && sha256sum -c "$(basename "$f").sha256")
          done
          dpkg-deb --contents dist/aegis_4.3.0_amd64.deb | grep -q './opt/aegis/server/frontend/package.json'
          dpkg-deb --contents dist/aegis_4.3.0_amd64.deb | grep -q './opt/aegis/server/aegis-link/pom.xml'
          dpkg-deb --contents dist/kraken_4.3.0_amd64.deb | grep -q './opt/aegis/kraken/services/kraken/honeypot/runner.py'
          tar -tzf dist/aegis-suite-4.3.0.tar.gz | grep -q 'aegis-suite-4.3.0/install.sh'
      - name: Upload server packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aegis-server-packages
          path: |
            dist/aegis_4.3.0_amd64.deb*
            dist/kraken_4.3.0_amd64.deb*
            dist/aegis-suite_4.3.0_all.deb*
            dist/aegis-suite-4.3.0.tar.gz*
            dist/aegis-pilot-signing-key.asc
          if-no-files-found: error

  packaging_rpm:
    name: Packaging Linux (RPM)
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.4'
          cache-dependency-path: aegis-agent/go.sum
      - name: Install RPM tooling
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Build RPM
        run: VERSION=4.3.0 ./scripts/build-rpm.sh
      - name: Verify RPM metadata and contents
        run: |
          rpm -qip dist/aegis-agent-4.3.0-1.x86_64.rpm
          rpm -qlp dist/aegis-agent-4.3.0-1.x86_64.rpm
          (cd dist && sha256sum -c aegis-agent-4.3.0-1.x86_64.rpm.sha256)
      - name: Upload RPM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aegis-agent-rpm
          path: |
            dist/*.rpm
            dist/*.sha256
          if-no-files-found: error

  packaging_rpm_install:
    name: Clean-host RPM install/uninstall
    needs: packaging_rpm
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Download RPM
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: aegis-agent-rpm
          path: dist
      - name: Install and remove in a disposable Rocky container
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/dist:/pkg:ro" rockylinux:9 bash -lc '
            set -euo pipefail
            dnf install -y /pkg/*.rpm
            test -x /usr/local/bin/aegis-agent
            test -f /lib/systemd/system/aegis-agent.service
            rpm -q aegis-agent
            rpm -e aegis-agent
            test ! -e /usr/local/bin/aegis-agent
            test ! -e /lib/systemd/system/aegis-agent.service
            echo "RPM install/uninstall PASS"
          '

  packaging_opkg:
    name: Packaging OpenWrt (ipk)
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.4'
          cache-dependency-path: aegis-agent/go.sum
      - name: Install ipk tooling
        run: sudo apt-get update && sudo apt-get install -y binutils
      - name: Build ipk
        run: VERSION=4.3.0 ./scripts/build-opkg.sh
      - name: Verify ipk structure
        run: |
          ar t dist/aegis-agent_4.3.0_x86_64.ipk
          tar -tzf <(ar p dist/aegis-agent_4.3.0_x86_64.ipk control.tar.gz) | grep -q ./control
          (cd dist && sha256sum -c aegis-agent_4.3.0_x86_64.ipk.sha256)
      - name: Upload ipk artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aegis-agent-opkg
          path: |
            dist/*.ipk
            dist/*.sha256
          if-no-files-found: error

  release_assets:
    name: Attach packaged artifacts to the release
    # The tag workflow in ci.yml creates the release; this job only adds the
    # installable packages, so ak update has something to download.
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs:
      - packaging_windows_server
      - packaging_server
      - packaging_rpm
      - packaging_opkg
      - production_windows
      - production_windows_server
      - production_linux
    timeout-minutes: 25
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          # Only production-signed agent artifacts: the test-signed builds use the
          # same file names and would silently win a merge-multiple download.
          pattern: '{aegis-server-msis,aegis-server-msis-production,aegis-server-packages,aegis-agent-rpm,aegis-agent-opkg,aegis-agent-msi-production,aegis-agent-deb-production}'
          path: dist
          merge-multiple: true
      - name: Verify the tag matches the artifacts
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          ls -1 dist
          for expected in \
            "aegis-server-$tag-x64.msi" \
            "kraken-server-$tag-x64.msi" \
            "aegis-suite-$tag-x64.msi" \
            "aegis_${tag}_amd64.deb" \
            "kraken_${tag}_amd64.deb" \
            "aegis-suite_${tag}_all.deb" \
            "aegis-suite-$tag.tar.gz" \
            "aegis-agent-$tag-x64.msi"; do
            test -f "dist/$expected" || {
              echo "::error::missing $expected; the tag does not match the built version"
              exit 1
            }
            test -f "dist/$expected.sha256" || {
              echo "::error::missing $expected.sha256; ak update verifies sidecars"
              exit 1
            }
          done
      - name: Wait for the release created by the tag workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          for attempt in $(seq 1 60); do
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "Release $tag exists; attaching packages"
              exit 0
            fi
            sleep 10
          done
          echo "::error::release $tag was not created by the tag workflow; nothing was uploaded"
          exit 1
      - name: Upload without overwriting (published assets are immutable)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          files=()
          skipped=""
          for file in dist/*.deb dist/*.deb.asc dist/*.deb.sha256 dist/*.deb.signing.json \
                      dist/*.rpm dist/*.rpm.sha256 dist/*.ipk dist/*.ipk.sha256 \
                      dist/aegis-suite-*.tar.gz dist/aegis-suite-*.tar.gz.sha256 \
                      dist/aegis-pilot-signing-key.asc \
                      dist/*.msi dist/*.msi.sha256 dist/*.msi.signing.json; do
            [ -f "$file" ] || continue
            name="$(basename "$file")"
            msi=""
            case "$name" in
              *.msi) msi="$name" ;;
              *.msi.sha256|*.msi.signing.json) msi="${name%.msi*}.msi" ;;
            esac
            if [ -n "$msi" ]; then
              mode="$(python3 -c "import json,sys;print(json.load(open(sys.argv[1])).get('mode',''))" "dist/$msi.signing.json" 2>/dev/null || true)"
              if [ "$mode" != "production" ]; then
                echo "::warning::$msi is ${mode:-unsigned} signed; a public release requires production signing, so it is not attached"
                skipped="$skipped $name"
                continue
              fi
            fi
            files+=("$file")
          done
          [ "${#files[@]}" -gt 0 ] || { echo "::error::nothing to upload"; exit 1; }
          existing="$(gh release view "$tag" --json assets --jq '.assets[].name')"
          for file in "${files[@]}"; do
            name="$(basename "$file")"
            if printf '%s\n' "$existing" | grep -qxF "$name"; then
              echo "::error::release $tag already has $name; published assets are immutable"
              exit 1
            fi
          done
          gh release upload "$tag" "${files[@]}"
          echo "Attached ${#files[@]} artifacts to $tag"
          if [ -n "$skipped" ]; then
            echo "Skipped (not production signed):$skipped"
          fi

  production_windows:
    name: Production Windows signature
    # A tag build must be production-signed, otherwise release_assets has nothing
    # publishable to attach (the CI default is a test certificate).
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.production_signing) || startsWith(github.ref, 'refs/tags/v') }}
    timeout-minutes: 25
    runs-on: windows-latest
    environment: production-signing
    env:
      AEGIS_WINDOWS_PFX_BASE64: ${{ secrets.AEGIS_WINDOWS_PFX_BASE64 }}
      AEGIS_MSI_PFX_PASSWORD: ${{ secrets.AEGIS_MSI_PFX_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.4'
          cache-dependency-path: aegis-agent/go.sum
      - name: Install WiX 5
        shell: pwsh
        run: |
          dotnet tool install --tool-path .tmp/wix5 wix --version 5.0.2
          .\.tmp\wix5\wix.exe extension add -g WixToolset.Util.wixext/5.0.2
      - name: Build and production-sign MSI
        shell: pwsh
        run: |
          if (-not $env:AEGIS_WINDOWS_PFX_BASE64) { throw "AEGIS_WINDOWS_PFX_BASE64 is not configured" }
          New-Item -ItemType Directory -Path .tmp -Force | Out-Null
          $pfx = Join-Path $PWD ".tmp\codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:AEGIS_WINDOWS_PFX_BASE64))
          try {
            .\scripts\build-msi.ps1 -Version 4.3.0 -OutDir dist -ProductionSign -PfxPath $pfx
          } finally {
            Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue
          }
      - name: Upload production MSI
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aegis-agent-msi-production
          path: |
            dist/*.msi
            dist/*.sha256
            dist/*.signing.json
          if-no-files-found: error

  production_windows_server:
    name: Production Windows server MSIs
    # A tag build must ship the three server MSIs; release_assets refuses the
    # test-signed CI copies, so this job is what makes ak update work on Windows.
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.production_signing) || startsWith(github.ref, 'refs/tags/v') }}
    timeout-minutes: 30
    runs-on: windows-latest
    environment: production-signing
    env:
      AEGIS_WINDOWS_PFX_BASE64: ${{ secrets.AEGIS_WINDOWS_PFX_BASE64 }}
      AEGIS_MSI_PFX_PASSWORD: ${{ secrets.AEGIS_MSI_PFX_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install WiX 5
        shell: pwsh
        run: |
          dotnet tool install --tool-path .tmp/wix5 wix --version 5.0.2
          .\.tmp\wix5\wix.exe extension add -g WixToolset.UI.wixext/5.0.2
      - name: Build and production-sign the three server MSIs
        shell: pwsh
        run: |
          if (-not $env:AEGIS_WINDOWS_PFX_BASE64) { throw "AEGIS_WINDOWS_PFX_BASE64 is not configured" }
          New-Item -ItemType Directory -Path .tmp -Force | Out-Null
          $pfx = Join-Path $PWD ".tmp\codesign-server.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:AEGIS_WINDOWS_PFX_BASE64))
          try {
            foreach ($edition in @("aegis", "kraken", "suite")) {
              .\scripts\build-server-msi.ps1 -Edition $edition -Version 4.3.0 -OutDir dist -ProductionSign -PfxPath $pfx
            }
          } finally {
            Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue
          }
          foreach ($stem in @("aegis-server", "kraken-server", "aegis-suite")) {
            $info = Get-Content "dist\$stem-4.3.0-x64.msi.signing.json" -Raw | ConvertFrom-Json
            if ($info.mode -ne "production") {
              throw "$stem is not production-signed (mode: $($info.mode)); a public release would skip it"
            }
          }
      - name: Upload production server MSIs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aegis-server-msis-production
          path: |
            dist/*.msi
            dist/*.sha256
            dist/*.signing.json
          if-no-files-found: error

  production_linux:
    name: Production Linux signature
    # A tag build must be production-signed, otherwise release_assets has nothing
    # publishable to attach (the CI default is a test certificate).
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.production_signing) || startsWith(github.ref, 'refs/tags/v') }}
    timeout-minutes: 20
    runs-on: ubuntu-latest
    environment: production-signing
    env:
      GPG_PRIVATE_KEY: ${{ secrets.AEGIS_GPG_PRIVATE_KEY }}
      GPG_KEY_ID: ${{ secrets.AEGIS_GPG_KEY_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.4'
          cache-dependency-path: aegis-agent/go.sum
      - name: Import registry key and build production deb
        run: |
          set -euo pipefail
          test -n "$GPG_PRIVATE_KEY"
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          SIGNING_MODE=production VERSION=4.3.0 ./scripts/build-deb.sh
          gpg --batch --verify dist/aegis-agent_4.3.0_amd64.deb.asc \
            dist/aegis-agent_4.3.0_amd64.deb
      - name: Upload production deb
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aegis-agent-deb-production
          path: |
            dist/*.deb
            dist/*.asc
            dist/*.sha256
            dist/*.signing.json
          if-no-files-found: error
