server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Audit schermo-nero: index.html MAI in cache (altrimenti il browser resta
    # inchiodato a bundle vecchi crashati); asset con hash immutabili per un anno.
    # Nota nginx: add_header in location oscura quelli del server -> ripetuti qui.
    location = /index.html {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "no-store" always;
    }

    location /assets/ {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # Audit: senza questo proxy, /api/* rispondeva index.html con 200 e la
    # dashboard crashava su dati non-array (schermo nero). Stesso origin,
    # niente CORS; WebSocket con upgrade per /ws/overview.
    location /api/ {
        proxy_pass http://aegis-brain:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Health radice (liveness/readiness pubbliche by design sul brain).
    location /health/ {
        proxy_pass http://aegis-brain:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
}
