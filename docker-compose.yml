services:
  aegis-postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    container_name: aegis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-aegis}
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-aegis}"]
      interval: 5s
      timeout: 5s
      retries: 5

  aegis-redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    container_name: aegis-redis
    restart: unless-stopped
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    ports:
      - "127.0.0.1:${REDIS_PORT_EXTERNAL:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

  aegis-ollama:
    image: ollama/ollama:0.34.2@sha256:da6e0dc5651df159e45686fd663c4dbe1624a52c44d7280eeac1551d8f865532
    container_name: aegis-ollama
    profiles: ["ollama"]
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT_EXTERNAL:-11434}:11434"
    environment:
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_CONTEXT_LENGTH: 2048
    volumes:
      - ollama_data:/root/.ollama

  aegis-brain:
    build: ./aegis-brain
    container_name: aegis-brain
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    ports:
      - "127.0.0.1:${BRAIN_PORT_EXTERNAL:-8000}:8000"
    environment:
      # Il contenitore vede SOLO le variabili elencate qui: quelle scritte nel
      # .env ma assenti da questo blocco vengono ignorate in silenzio (era il
      # caso di DEBUG, scritto a mano a "true", e di JWT_EXPIRE_MINUTES).
      #
      # I profili sono namespaced AEGIS_* di proposito: compose fa vincere
      # l'ambiente dell'HOST sul .env, e un nome generico come DEBUG e' gia'
      # definito su molte macchine -> il brain partiva in lab mode anche con
      # DEBUG=false nel .env, senza validazione dei secret e senza il blocco
      # CORS wildcard. Con il prefisso la configurazione e' dell'applicazione,
      # non dell'host. Default = profilo produzione (fail-closed).
      DEBUG: ${AEGIS_DEBUG:-false}
      ALLOW_OPEN_REGISTRATION: ${AEGIS_ALLOW_OPEN_REGISTRATION:-false}
      # `Secure` sui cookie: true di default (richiede HTTPS). Va messo a false
      # nel .env solo per un accesso in HTTP, altrimenti il login non regge.
      COOKIE_SECURE: ${AEGIS_COOKIE_SECURE:-true}
      JWT_EXPIRE_MINUTES: ${AEGIS_JWT_EXPIRE_MINUTES:-60}
      JWT_ALGORITHM: ${AEGIS_JWT_ALGORITHM:-HS256}
      AI_RATE_LIMIT_PER_MIN: ${AEGIS_AI_RATE_LIMIT_PER_MIN:-20}
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@aegis-redis:6379
      REDIS_HOST: aegis-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      AEGIS_API_KEY: ${AEGIS_API_KEY:?AEGIS_API_KEY must be set}
      AGENT_ENROLL_KEY: ${AGENT_ENROLL_KEY:?AGENT_ENROLL_KEY must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      MASTER_KEY_B64: ${MASTER_KEY_B64:?MASTER_KEY_B64 must be set}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://aegis.local,http://localhost:3000}
      # AI pluggabile: auto = ollama se OLLAMA_URL e' raggiungibile, altrimenti
      # gemini/openai se la chiave esiste, altrimenti disabled (nessun costo).
      # Per usare un server Ollama potente in rete: OLLAMA_URL=http://host:11434/api/generate
      OLLAMA_URL: ${OLLAMA_URL:-http://aegis-ollama:11434/api/generate}
      OLLAMA_DEFAULT_MODEL: ${OLLAMA_DEFAULT_MODEL:-llama3}
      OLLAMA_ALLOWED_MODELS: ${OLLAMA_ALLOWED_MODELS:-}
      AI_PROVIDER: ${AI_PROVIDER:-auto}
      AI_MODEL: ${AI_MODEL:-}
      AI_AUTOMATIC_ENRICH: ${AI_AUTOMATIC_ENRICH:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      SHODAN_API_KEY: ${SHODAN_API_KEY}
      ABUSEIPDB_API_KEY: ${ABUSEIPDB_API_KEY}
      PKI_DIR: /app/pki
      ARTIFACT_DIR: /app/artifacts
      MTLS_MODE: ${MTLS_MODE:-off}
    volumes:
      # Post-audit: PKI e artefatti persistenti (mai effimeri nel container).
      - pki_data:/app/pki
      - artifact_data:/app/artifacts
    depends_on:
      aegis-postgres:
        condition: service_healthy
      aegis-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/ || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5

  aegis-link:
    build: ./aegis-link
    container_name: aegis-link
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LINK_PORT_EXTERNAL:-8080}:8080"
      - "127.0.0.1:1514:1514/udp"
    environment:
      SPRING_DATA_REDIS_HOST: aegis-redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      AEGIS_API_KEY: ${AEGIS_API_KEY:?AEGIS_API_KEY must be set}
    depends_on:
      aegis-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5

  aegis-frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    container_name: aegis-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./frontend/src:/app/src
    environment:
      - VITE_API_URL=${VITE_API_URL:-/api/v1}
    depends_on:
      aegis-brain:
        condition: service_healthy

  aegis-caddy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    container_name: aegis-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      aegis-brain:
        condition: service_healthy
      aegis-frontend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2019/config/ || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5

  aegis-backup:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    container_name: aegis-backup
    profiles: ["backup"]
    restart: unless-stopped
    entrypoint: |
      sh -c "
        apk add --no-cache curl gnupg;
        echo '0 */6 * * * /scripts/backup-db.sh' > /etc/crontabs/root;
        echo '5 */6 * * * /scripts/backup-pki.sh' >> /etc/crontabs/root;
        crond -f -l 2
      "
    environment:
      DB_HOST: aegis-postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-aegis}
      DB_USER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      BACKUP_DIR: /backups
      RETENTION_DAYS: 7
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
    volumes:
      - ./scripts/backup-db.sh:/scripts/backup-db.sh
      - ./scripts/backup-pki.sh:/scripts/backup-pki.sh
      - postgres_backups:/backups
      # Post-audit: la PKI entra nei backup (cifrati con BACKUP_PASSPHRASE).
      - pki_data:/pki:ro
      - artifact_data:/artifacts:ro
    depends_on:
      - aegis-postgres

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  caddy_data:
  caddy_config:
  guard_data:
  nodetrace_data:
  postgres_backups:
  pki_data:
  artifact_data:
