services:
  aegis-postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    container_name: aegis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-aegis}
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-aegis}"]
      interval: 5s
      timeout: 5s
      retries: 5

  aegis-redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    container_name: aegis-redis
    restart: unless-stopped
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    ports:
      - "127.0.0.1:${REDIS_PORT_EXTERNAL:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

  aegis-ollama:
    image: ollama/ollama:0.34.2@sha256:da6e0dc5651df159e45686fd663c4dbe1624a52c44d7280eeac1551d8f865532
    container_name: aegis-ollama
    profiles: ["ollama"]
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT_EXTERNAL:-11434}:11434"
    environment:
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_CONTEXT_LENGTH: 2048
    volumes:
      - ollama_data:/root/.ollama

  aegis-brain:
    build: ./aegis-brain
    container_name: aegis-brain
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "${BRAIN_WORKERS:-2}"]
    ports:
      - "127.0.0.1:${BRAIN_PORT_EXTERNAL:-8000}:8000"
    environment:
      # Il contenitore vede SOLO le variabili elencate qui: quelle scritte nel
      # .env ma assenti da questo blocco vengono ignorate in silenzio (era il
      # caso di DEBUG, scritto a mano a "true", e di JWT_EXPIRE_MINUTES).
      #
      # I profili sono namespaced AEGIS_* di proposito: compose fa vincere
      # l'ambiente dell'HOST sul .env, e un nome generico come DEBUG e' gia'
      # definito su molte macchine -> il brain partiva in lab mode anche con
      # DEBUG=false nel .env, senza validazione dei secret e senza il blocco
      # CORS wildcard. Con il prefisso la configurazione e' dell'applicazione,
      # non dell'host. Default = profilo produzione (fail-closed).
      DEBUG: ${AEGIS_DEBUG:-false}
      ALLOW_OPEN_REGISTRATION: ${AEGIS_ALLOW_OPEN_REGISTRATION:-false}
      # `Secure` sui cookie: true di default (richiede HTTPS). Va messo a false
      # nel .env solo per un accesso in HTTP, altrimenti il login non regge.
      COOKIE_SECURE: ${AEGIS_COOKIE_SECURE:-true}
      JWT_EXPIRE_MINUTES: ${AEGIS_JWT_EXPIRE_MINUTES:-60}
      JWT_ALGORITHM: ${AEGIS_JWT_ALGORITHM:-HS256}
      AI_RATE_LIMIT_PER_MIN: ${AEGIS_AI_RATE_LIMIT_PER_MIN:-20}
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@aegis-redis:6379
      REDIS_HOST: aegis-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      AEGIS_API_KEY: ${AEGIS_API_KEY:?AEGIS_API_KEY must be set}
      AGENT_ENROLL_KEY: ${AGENT_ENROLL_KEY:?AGENT_ENROLL_KEY must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      MASTER_KEY_B64: ${MASTER_KEY_B64:?MASTER_KEY_B64 must be set}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://aegis.local,http://localhost:3000}
      # AI pluggabile: auto = ollama se OLLAMA_URL e' raggiungibile, altrimenti
      # gemini/openai se la chiave esiste, altrimenti disabled (nessun costo).
      # Per usare un server Ollama potente in rete: OLLAMA_URL=http://host:11434/api/generate
      OLLAMA_URL: ${OLLAMA_URL:-http://aegis-ollama:11434/api/generate}
      OLLAMA_DEFAULT_MODEL: ${OLLAMA_DEFAULT_MODEL:-llama3}
      OLLAMA_ALLOWED_MODELS: ${OLLAMA_ALLOWED_MODELS:-}
      AI_PROVIDER: ${AI_PROVIDER:-auto}
      AI_MODEL: ${AI_MODEL:-}
      AI_AUTOMATIC_ENRICH: ${AI_AUTOMATIC_ENRICH:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      SHODAN_API_KEY: ${SHODAN_API_KEY}
      ABUSEIPDB_API_KEY: ${ABUSEIPDB_API_KEY}
      PKI_DIR: /app/pki
      ARTIFACT_DIR: /app/artifacts
      MTLS_MODE: ${MTLS_MODE:-off}
      MTLS_REJECT_LEGACY_HEADER: ${MTLS_REJECT_LEGACY_HEADER:-true}
      # With more than one worker, rate-limit counters must be shared.
      RATE_LIMIT_STORAGE_URI: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@aegis-redis:6379/1
      RATE_LIMIT_TRUST_FORWARDED_FOR: ${RATE_LIMIT_TRUST_FORWARDED_FOR:-true}
      # Kraken vertical: disabled unless the operator opts in. The ingest path
      # still requires its own API key + HMAC secret; SSO uses a dedicated key.
      KRAKEN_INGEST_ENABLED: ${KRAKEN_INGEST_ENABLED:-false}
      KRAKEN_INGEST_SECRET: ${KRAKEN_INGEST_SECRET:-}
      KRAKEN_INGEST_MAX_BYTES: ${KRAKEN_INGEST_MAX_BYTES:-1048576}
      KRAKEN_INGEST_MAX_EVENTS: ${KRAKEN_INGEST_MAX_EVENTS:-500}
      KRAKEN_SSO_ENABLED: ${KRAKEN_SSO_ENABLED:-false}
      KRAKEN_SSO_SECRET: ${KRAKEN_SSO_SECRET:-}
      KRAKEN_SSO_TTL_SECONDS: ${KRAKEN_SSO_TTL_SECONDS:-60}
    volumes:
      # Post-audit: PKI e artefatti persistenti (mai effimeri nel container).
      - pki_data:/app/pki
      - artifact_data:/app/artifacts
    depends_on:
      aegis-postgres:
        condition: service_healthy
      aegis-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/ || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5

  aegis-link:
    build: ./aegis-link
    container_name: aegis-link
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LINK_PORT_EXTERNAL:-8080}:8080"
      - "127.0.0.1:1514:1514/udp"
    environment:
      SPRING_DATA_REDIS_HOST: aegis-redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      AEGIS_API_KEY: ${AEGIS_API_KEY:?AEGIS_API_KEY must be set}
      AEGIS_LINK_SPOOL_DIR: /var/lib/aegis-link/spool
    volumes:
      - link_spool:/var/lib/aegis-link/spool
    depends_on:
      aegis-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5

  aegis-frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    container_name: aegis-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./frontend/src:/app/src
    environment:
      - VITE_API_URL=${VITE_API_URL:-/api/v1}
    depends_on:
      aegis-brain:
        condition: service_healthy

  aegis-caddy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    container_name: aegis-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      aegis-brain:
        condition: service_healthy
      aegis-frontend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2019/config/ || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5

  # ── Kraken vertical (profile: kraken) ──────────────────────────────────────
  # Separate database, Redis, network, users and credentials. The Brain never
  # reaches into Kraken's DB: it only receives signed ingest events and issues
  # a short-lived SSO assertion for the browser.
  aegis-kraken-db:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    container_name: aegis-kraken-db
    restart: unless-stopped
    profiles: ["kraken"]
    environment:
      POSTGRES_DB: krakendb
      POSTGRES_USER: kraken
      POSTGRES_PASSWORD: ${KRAKEN_DB_PASSWORD:?KRAKEN_DB_PASSWORD must be set for the kraken profile}
    volumes:
      - kraken_pgdata:/var/lib/postgresql/data
    networks:
      - kraken_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kraken -d krakendb"]
      interval: 5s
      timeout: 5s
      retries: 10

  aegis-kraken-redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    container_name: aegis-kraken-redis
    restart: unless-stopped
    profiles: ["kraken"]
    command: ["sh", "-c", "redis-server --requirepass \"$${KRAKEN_REDIS_PASSWORD}\""]
    environment:
      KRAKEN_REDIS_PASSWORD: ${KRAKEN_REDIS_PASSWORD:?KRAKEN_REDIS_PASSWORD must be set for the kraken profile}
    networks:
      - kraken_internal
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${KRAKEN_REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Build-only helper: the broker starts sandbox containers by image name.
  # `docker compose --profile kraken build` produces this image; the helper
  # itself exits immediately and never handles traffic.
  aegis-kraken-sandbox-image:
    build:
      context: ./services/kraken
      dockerfile: Dockerfile.sandbox
    image: kraken_sandbox:latest
    container_name: aegis-kraken-sandbox-image
    profiles: ["kraken"]
    network_mode: none
    restart: "no"
    entrypoint: ["/bin/true"]

  aegis-kraken-init:
    image: alpine:3.19
    profiles: ["kraken"]
    restart: "no"
    command: ["sh", "-c", "mkdir -p /data/malware /data/logs && chown -R 1000:1000 /data"]
    volumes:
      - kraken_data:/data

  aegis-kraken-broker:
    build:
      context: ./services/kraken
      dockerfile: Dockerfile.broker
    container_name: aegis-kraken-broker
    restart: unless-stopped
    profiles: ["kraken"]
    environment:
      SANDBOX_BROKER_TOKEN: ${SANDBOX_BROKER_TOKEN:?SANDBOX_BROKER_TOKEN must be set for the kraken profile}
      SANDBOX_IMAGE: kraken_sandbox
      MALWARE_DIR: /app/data/malware
      MALWARE_MAX_FILE_BYTES: ${MALWARE_MAX_FILE_BYTES:-67108864}
      MALWARE_MAX_SESSION_BYTES: ${MALWARE_MAX_SESSION_BYTES:-268435456}
      MALWARE_RETENTION_DAYS: ${MALWARE_RETENTION_DAYS:-30}
      MALWARE_MAX_TOTAL_BYTES: ${MALWARE_MAX_TOTAL_BYTES:-5368709120}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - kraken_data:/app/data
    depends_on:
      aegis-kraken-init:
        condition: service_completed_successfully
    networks:
      - kraken_internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  aegis-kraken:
    build:
      context: ./services/kraken
      dockerfile: Dockerfile
    image: aegis-kraken:local
    container_name: aegis-kraken
    restart: unless-stopped
    profiles: ["kraken"]
    expose:
      - "8000"
    ports:
      - "127.0.0.1:${KRAKEN_PORT_EXTERNAL:-8001}:8000"
    environment:
      DEBUG: "false"
      PUBLIC_BASE_PATH: /kraken
      SECRET_KEY: ${KRAKEN_SECRET_KEY:?KRAKEN_SECRET_KEY must be set for the kraken profile}
      INTERNAL_API_KEY: ${KRAKEN_INTERNAL_API_KEY:?KRAKEN_INTERNAL_API_KEY must be set for the kraken profile}
      ALLOW_REGISTRATION: "false"
      DATABASE_URL: postgresql+asyncpg://kraken:${KRAKEN_DB_PASSWORD:?KRAKEN_DB_PASSWORD must be set for the kraken profile}@aegis-kraken-db:5432/krakendb
      REDIS_URL: redis://:${KRAKEN_REDIS_PASSWORD:?KRAKEN_REDIS_PASSWORD must be set for the kraken profile}@aegis-kraken-redis:6379/0
      REDIS_PASSWORD: ${KRAKEN_REDIS_PASSWORD:?KRAKEN_REDIS_PASSWORD must be set for the kraken profile}
      KRAKEN_SSO_ENABLED: ${KRAKEN_SSO_ENABLED:-true}
      KRAKEN_SSO_SECRET: ${KRAKEN_SSO_SECRET:?KRAKEN_SSO_SECRET must be set for the kraken profile}
      SANDBOX_BROKER_URL: http://aegis-kraken-broker:8100
      SANDBOX_BROKER_TOKEN: ${SANDBOX_BROKER_TOKEN:?SANDBOX_BROKER_TOKEN must be set for the kraken profile}
      SENSOR_CONFIG_SIGNING_KEY: ${KRAKEN_SENSOR_CONFIG_SIGNING_KEY:-}
      FILE_ANALYSIS_ENABLED: ${KRAKEN_FILE_ANALYSIS_ENABLED:-true}
      FILE_ANALYSIS_MAX_BYTES: ${KRAKEN_FILE_ANALYSIS_MAX_BYTES:-67108864}
      FILE_ANALYSIS_TIMEOUT_S: ${KRAKEN_FILE_ANALYSIS_TIMEOUT_S:-30}
      FILE_ANALYSIS_STORAGE_DIR: /app/data/samples
      FILE_ANALYSIS_POLL_INTERVAL_S: ${KRAKEN_FILE_ANALYSIS_POLL_INTERVAL_S:-1}
      OBJECT_STORE_BACKEND: ${KRAKEN_OBJECT_STORE_BACKEND:-local}
      OBJECT_STORE_S3_BUCKET: ${KRAKEN_OBJECT_STORE_S3_BUCKET:-}
      OBJECT_STORE_S3_PREFIX: ${KRAKEN_OBJECT_STORE_S3_PREFIX:-kraken-samples}
      OBJECT_STORE_S3_ENDPOINT: ${KRAKEN_OBJECT_STORE_S3_ENDPOINT:-}
      OBJECT_STORE_S3_ACCESS_KEY: ${KRAKEN_OBJECT_STORE_S3_ACCESS_KEY:-}
      OBJECT_STORE_S3_SECRET_KEY: ${KRAKEN_OBJECT_STORE_S3_SECRET_KEY:-}
      OBJECT_STORE_S3_REGION: ${KRAKEN_OBJECT_STORE_S3_REGION:-}
      OBJECT_STORE_S3_USE_SSL: ${KRAKEN_OBJECT_STORE_S3_USE_SSL:-true}
      DETONATION_ENABLED: ${KRAKEN_DETONATION_ENABLED:-false}
      DETONATION_URL: ${KRAKEN_DETONATION_URL:-}
      DETONATION_TOKEN: ${KRAKEN_DETONATION_TOKEN:-}
      DETONATION_TIMEOUT_S: ${KRAKEN_DETONATION_TIMEOUT_S:-120}
      MALWARE_RETENTION_DAYS: ${MALWARE_RETENTION_DAYS:-30}
      MALWARE_MAX_TOTAL_BYTES: ${MALWARE_MAX_TOTAL_BYTES:-5368709120}
      CORS_ORIGINS: ${ALLOWED_ORIGINS:-https://aegis.local,http://localhost:3000}
      AEGIS_INGEST_ENABLED: ${KRAKEN_INGEST_ENABLED:-false}
      AEGIS_INGEST_URL: http://aegis-brain:8000
      AEGIS_INGEST_KEY: ${KRAKEN_INGEST_KEY:-}
      AEGIS_INGEST_SECRET: ${KRAKEN_INGEST_SECRET:-}
      AEGIS_INGEST_TIMEOUT_S: ${AEGIS_INGEST_TIMEOUT_S:-5}
      AEGIS_OUTBOX_POLL_INTERVAL_S: ${AEGIS_OUTBOX_POLL_INTERVAL_S:-2}
      AEGIS_OUTBOX_BATCH_SIZE: ${AEGIS_OUTBOX_BATCH_SIZE:-500}
      AEGIS_OUTBOX_MAX_ATTEMPTS: ${AEGIS_OUTBOX_MAX_ATTEMPTS:-8}
      AEGIS_OUTBOX_BACKOFF_BASE_S: ${AEGIS_OUTBOX_BACKOFF_BASE_S:-2}
      AEGIS_OUTBOX_BACKOFF_MAX_S: ${AEGIS_OUTBOX_BACKOFF_MAX_S:-300}
      AEGIS_OUTBOX_STALE_AFTER_S: ${AEGIS_OUTBOX_STALE_AFTER_S:-300}
    volumes:
      - kraken_data:/app/data
    depends_on:
      aegis-kraken-init:
        condition: service_completed_successfully
      aegis-kraken-db:
        condition: service_healthy
      aegis-kraken-redis:
        condition: service_healthy
      aegis-kraken-broker:
        condition: service_healthy
    networks:
      - default
      - kraken_internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  aegis-kraken-sensors:
    build:
      context: ./services/kraken
      dockerfile: Dockerfile
    image: aegis-kraken:local
    container_name: aegis-kraken-sensors
    restart: unless-stopped
    profiles: ["kraken"]
    command: python honeypot/runner.py
    environment:
      INTERNAL_API_KEY: ${KRAKEN_INTERNAL_API_KEY:?KRAKEN_INTERNAL_API_KEY must be set for the kraken profile}
      SSH_SENSOR_PORT: 2222
      HTTP_SENSOR_PORT: 8080
      FTP_SENSOR_PORT: 2121
      TELNET_SENSOR_PORT: 2323
      SMB_SENSOR_PORT: 445
      RDP_SENSOR_PORT: 3389
      SENSOR_CONFIG_SIGNING_KEY: ${KRAKEN_SENSOR_CONFIG_SIGNING_KEY:-}
    ports:
      - "${KRAKEN_SSH_PORT:-12222}:2222"
      - "${KRAKEN_HTTP_PORT:-18080}:8080"
      - "${KRAKEN_FTP_PORT:-12121}:2121"
      - "${KRAKEN_TELNET_PORT:-12323}:2323"
      - "${KRAKEN_SMB_PORT:-11445}:445"
      - "${KRAKEN_RDP_PORT:-13389}:3389"
    depends_on:
      aegis-kraken:
        condition: service_healthy
    networks:
      - kraken_internal

  aegis-backup:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    container_name: aegis-backup
    profiles: ["backup"]
    restart: unless-stopped
    entrypoint: |
      sh -c "
        apk add --no-cache curl gnupg;
        echo '0 */6 * * * /scripts/backup-db.sh' > /etc/crontabs/root;
        echo '5 */6 * * * /scripts/backup-pki.sh' >> /etc/crontabs/root;
        crond -f -l 2
      "
    environment:
      DB_HOST: aegis-postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-aegis}
      DB_USER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      BACKUP_DIR: /backups
      RETENTION_DAYS: 7
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
    volumes:
      - ./scripts/backup-db.sh:/scripts/backup-db.sh
      - ./scripts/backup-pki.sh:/scripts/backup-pki.sh
      - postgres_backups:/backups
      # Post-audit: la PKI entra nei backup (cifrati con BACKUP_PASSPHRASE).
      - pki_data:/pki:ro
      - artifact_data:/artifacts:ro
    depends_on:
      - aegis-postgres

networks:
  # Kraken's DB/Redis/broker are reachable only on this internal network.
  # The app also joins the default network so Caddy can route /kraken/* to it.
  kraken_internal:
    internal: true

volumes:
  link_spool:
  postgres_data:
  redis_data:
  ollama_data:
  caddy_data:
  caddy_config:
  kraken_pgdata:
  kraken_data:
  guard_data:
  nodetrace_data:
  postgres_backups:
  pki_data:
  artifact_data:
